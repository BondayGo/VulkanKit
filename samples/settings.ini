; Planned collector schema for the next VulkanKit revision.
; NOTE: the current scripts/collect.ps1 writes plain-text reports and does
; not read this file yet. These keys document the planned condensed format.

[collector]
; Directory for timestamped reports, relative to the bundle root.
output_dir = reports
; Keep this many days of reports; older files are pruned by the cleanup task.
retention_days = 30
; utf8 keeps device names readable across locales.
encoding = utf8

[report]
; summary = device names + driver versions only; full = complete dump.
mode = full
; Include queue family and memory heap sections.
include_queues = true
include_memory = true

[catalog]
; Revision of catalog.pdf these settings were validated against.
revision = 2026-06
